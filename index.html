function buildBatchReport(trips,fuelRows,expenseRows,docsRows,closedAt,batchId){
 const sum=(rows,key)=>rows.reduce((a,x)=>a+Number(x[key]||0),0);
 const fuelFor=type=>fuelRows.filter(x=>(x.type||'diesel')===type);
 const fuelLine=type=>{const rows=fuelFor(type);const currencies=[...new Set(rows.map(x=>x.currency).filter(Boolean))];return `${fuelLabel(type)}: ${sum(rows,'liters').toFixed(2)} л; стоимость ${sum(rows,'cost').toFixed(2)}${currencies.length?` ${currencies.join('/')}`:''}`};
 const totalKm=trips.reduce((a,t)=>a+Math.max(0,Number(t.endKm||0)-Number(t.startKm||0)),0);
 const tripLines=trips.map((t,i)=>`${i+1}. ${t.no||'Без номера'} | ${t.date||'Дата не указана'} | ${t.from||'—'} → ${t.to||'—'} | водитель: ${t.driver||'—'} | тягач: ${t.truck||'—'} | прицеп: ${t.trailer||'—'} | пробег: ${Math.max(0,Number(t.endKm||0)-Number(t.startKm||0))} км`);
 const expenseLines=expenseRows.map((x,i)=>`${i+1}. ${x.operationType==='withdrawal'||x.category==='Снятие наличных'?'Снятие наличных':(x.category||'Расход')}: ${x.amount||0} ${x.currency||''}; оплата: ${paymentLabel(x.payment)}${x.bankCard?`; карта: ${x.bankCard}`:''}${x.trip?`; рейс: ${x.trip}`:''}${x.note?`; примечание: ${x.note}`:''}`);
 const fuelLines=fuelRows.map((x,i)=>`${i+1}. ${fuelLabel(x.type)}: ${x.liters||0} л; ${x.cost||0} ${x.currency||''}; ${x.station||'АЗС не указана'}${x.trip?`; рейс: ${x.trip}`:''}`);
 const docLines=docsRows.map((x,i)=>`${i+1}. ${x.trip||'Без рейса'} | ${x.type||'Документ'} | ${x.name||'Без названия'}${x.note?` | ${x.note}`:''}`);
 return [`ОБЩИЙ ОТЧЁТ ПО ВСЕМ РЕЙСАМ`,`Номер группового закрытия: ${batchId}`,`Дата и время закрытия: ${closedAt}`,`Закрыл: ${db.user.name||'—'}`,`Количество рейсов: ${trips.length}`,`Общий пробег: ${totalKm} км`,'',`РЕЙСЫ`,...tripLines,'',`ИТОГ ПО ТОПЛИВУ`,fuelLine('diesel'),fuelLine('adblue'),fuelLine('antigel'),`Всего записей заправок: ${fuelRows.length}`,'',`ДЕТАЛИ ЗАПРАВОК`,...(fuelLines.length?fuelLines:['Заправок нет']),'',`РАСХОДЫ И СНЯТИЕ НАЛИЧНЫХ`,`Количество операций: ${expenseRows.length}`,`Сумма операций по валютам:`,...([...new Set(expenseRows.map(x=>x.currency||'Без валюты'))].map(c=>`${c}: ${sum(expenseRows.filter(x=>(x.currency||'Без валюты')===c),'amount').toFixed(2)}`)),...(expenseLines.length?expenseLines:['Расходов нет']),'',`ДОКУМЕНТЫ`,...(docLines.length?docLines:['Документов нет']),'',`После закрытия активные рейсы, текущие расходы и текущие записи топлива перенесены в этот общий архивный отчёт.`].join('\n');
}
async function finishAllTrips(){
 const trips=[...db.trips];
 if(!trips.length){alert('Нет активных рейсов для завершения');return}
 const fuelRows=[...db.fuel],expenseRows=[...db.expenses];
 const ids=new Set(trips.map(t=>t.id));
 const docsRows=db.docs.filter(d=>ids.has(d.tripId)||!d.tripId);
 const batchId='ПАКЕТ-'+new Date().toISOString().replace(/[-:TZ.]/g,'').slice(0,14)+'-'+id().slice(-4);
 const closedAt=new Date().toLocaleString('ru-RU');
 const report=buildBatchReport(trips,fuelRows,expenseRows,docsRows,closedAt,batchId);
 const confirmText=`Закрыть ВСЕ активные рейсы (${trips.length}) одним общим отчётом?\n\nВ общий отчёт войдут ${expenseRows.length} расходов/снятий и ${fuelRows.length} записей топлива (дизель, AdBlue, антигель).\n\nПосле закрытия активный список и счётчики топлива обнулятся. Данные останутся в архивном отчёте.`;
 if(!confirm(confirmText))return;
 const batchData={trips,fuel:fuelRows,expenses:expenseRows,docs:docsRows,closedAt,batchId,closedBy:db.user.name};
 const archived=trips.map(t=>({...t,status:'Завершён',completedAt:closedAt,closedBy:db.user.name,batchId,batchTitle:batchId,report,batchData}));
 db.archiveTrips.push(...archived);
 db.trips=[];
 db.fuel=[];
 db.expenses=[];
 save();
 render('home');
 let serverSaved=false;
 if(db.company.server)serverSaved=await pushServer();
 if(navigator.share){
   try{await navigator.share({title:`Общий отчёт ${batchId}`,text:report});alert(serverSaved?'Все рейсы закрыты одним отчётом. Данные сохранены на сервере, отчёт передан в меню отправки.':'Все рейсы закрыты одним отчётом. Отчёт сохранён в архиве и передан в меню отправки.');return}
   catch(e){if(e.name==='AbortError'){alert('Рейсы закрыты. Общий отчёт сохранён в архиве.');return}}
 }
 download(`Общий_отчёт_${batchId}.txt`,'text/plain;charset=utf-8',report);
 alert(serverSaved?'Все рейсы закрыты. Общий отчёт сохранён на сервере и скачан.':'Все рейсы закрыты. Общий отчёт сохранён в архиве и скачан.');
}

<div class="card"><h3>Журнал заправок</h3>${db.fuel.slice().reverse().map(x=>{let tr=db.trips.find(t=>t.id===x.tripId);return `<div class="item"><b>${fuelLabel(x.type)}</b> • ${esc(x.date)} • <b>${esc(x.liters)} л</b> • ${esc(x.cost)} ${esc(x.currency)}<br>${esc(x.station)} • рейс ${esc(tr?.no||x.trip||'—')}<br>Оплата: ${x.payment==='card'?'Банковская карта: '+esc(x.bankCard||'—'):x.payment==='fuelcard'?'Топливная карта: '+esc(x.fuelCard||'—'):'Наличные'}<br><button class="action small" onclick="editFuel('${x.id}')">Редактировать</button> <button class="danger action small" onclick="del('fuel','${x.id}')">Удалить</button></div>`}).join('')||'<div class="muted">Нет заправок.</div>'}</div><div class="card"><h3>Сохранённые топливные карты</h3>${(db.fuelCards||[]).map(c=>`<div class="item">⛽ ${esc(c)} <button class="danger action small" onclick="removeFuelCard('${esc(c).replaceAll("'", "\\\\'")}')">Удалить</button></div>`).join('')||'<div class="muted">Топливные карты ещё не добавлены.</div>'}</div>`}

function more(){return `<h2>Ещё: ТО, маршрут, GPS и отчёты</h2><div class="card"><h3>Техническое обслуживание</h3><div class="grid"><label>Дата<input id="m_date" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Одометр, км<input id="m_km" type="number" min="0" placeholder="Например, 245000"></label><label>Тягач<select id="m_truck"><option value="">Не указан</option>${db.trucks.map(t=>`<option>${esc(t.plate)}</option>`).join('')}</select></label><label>Прицеп<select id="m_trailer"><option value="">Без прицепа / не указан</option>${db.trailers.map(t=>`<option>${esc(t.plate)}${t.type?' • '+esc(t.type):''}</option>`).join('')}</select></label><label>Вид работ<select id="m_type"><option>Плановое ТО</option><option>Замена моторного масла</option><option>Замена масляного фильтра</option><option>Замена воздушного фильтра</option><option>Замена топливного фильтра</option><option>Замена салонного фильтра</option><option>Замена масла в КПП</option><option>Замена масла в редукторе / мосту</option><option>Диагностика двигателя</option><option>Ремонт двигателя</option><option>Ремонт КПП / сцепления</option><option>Ремонт ходовой части</option><option>Тормозная система</option><option>Пневматическая система</option><option>Электрика и аккумулятор</option><option>Система охлаждения</option><option>Ремонт топливной системы</option><option>Ремонт выхлопной системы</option><option>Ремонт рулевого управления</option><option>Шиномонтаж / балансировка</option><option>Замена шин</option><option>Ремонт прокола</option><option>Сход-развал</option><option>Обслуживание кондиционера</option><option>Замена ремней и роликов</option><option>Смазка узлов</option><option>Мойка / очистка</option><option>Осмотр перед рейсом</option><option>Ремонт прицепа</option><option>Ремонт тента / кузова</option><option>Другое</option></select></label><label>Стоимость<input id="m_cost" type="number" step=".01" min="0" placeholder="0"></label><label>Валюта<select id="m_currency">${currencyOptions('KZT')}</select></label></div><label>Описание работ<input id="m_note" placeholder="Запчасти, выполненные работы, комментарий"></label><button class="primary" onclick="addMaintenance()">Добавить запись ТО</button><div class="item"><b>Журнал ТО</b>${db.maintenance.slice().reverse().map(x=>`<div class="sublist"><b>${esc(x.type)}</b> • ${esc(x.km)} км<br>${esc(x.date)} • тягач: ${esc(x.truck||'не указан')} • прицеп: ${esc(x.trailer||'не указан')}<br>${esc(x.note||'Без комментария')} • ${esc(x.cost||0)} ${esc(x.currency||'KZT')} <button class="danger action small" onclick="del('maintenance','${x.id}')">Удалить</button></div>`).join('')||'<div class="muted">Записей ТО пока нет</div>'}</div></div>
<div class="card"><h3>GPS</h3><button class="primary" onclick="gps()">Получить текущую точку</button><div id="gpsout" class="muted">${db.gps.slice(-1)[0]?JSON.stringify(db.gps.slice(-1)[0]):''}</div></div>
<div class="card"><h3>Точка маршрута / таможня</h3><div class="grid"><input id="r_city" placeholder="Город / пункт"><select id="r_type"><option>Маршрут</option><option>Загрузка</option><option>Выгрузка</option><option>Таможня</option><option>Стоянка</option></select><input id="r_note" placeholder="Примечание"><input id="r_date" type="datetime-local" value="${now()}"></div><button class="primary" onclick="addRoute()">Добавить</button>
${db.route.slice().reverse().map(x=>`<div class="item"><b>${esc(x.city)}</b> • <span class="badge">${esc(x.type)}</span><br>${esc(x.date)} • ${esc(x.note)}<br><button class="action small" onclick="editRoute('${x.id}')">Редактировать</button> <button class="danger action small" onclick="del('route','${x.id}')">Удалить</button></div>`).join('')}</div>
<div class="card"><h3>Профиль</h3><div>${esc(db.user.name)} • ${esc(({driver:"Водитель",manager:"Менеджер",director:"Директор"})[db.user.role]||db.user.role)}</div><button class="action" onclick="logout()">Сменить пользователя</button></div><div class="card"><h3>Настройки и сервер</h3><input id="c_name" value="${esc(db.company.name)}" placeholder="Название компании"><input id="u_name" value="${esc(db.user.name)}" placeholder="Пользователь"><select id="u_role"><option value="driver" ${db.user.role==='driver'?'selected':''}>Водитель</option><option value="manager" ${db.user.role==='manager'?'selected':''}>Менеджер</option><option value="director" ${db.user.role==='director'?'selected':''}>Директор</option></select><input id="server" value="${esc(db.company.server)}" placeholder="URL API, например https://server.example.com"><input id="apiKey" type="password" value="${esc(db.company.apiKey||'')}" placeholder="API ключ"><div class="row"><button class="primary" onclick="saveSettings()">Сохранить</button><button class="action" onclick="pushServer()">Отправить на сервер</button><button class="action" onclick="loadServer()">Загрузить с сервера</button></div><div id="syncStatus" class="muted">${db.company.server?'Сервер настроен':'Сервер не настроен'}</div></div>

<div class="card"><h3>Документы рейсов</h3><div class="notice">Документы теперь синхронизируются вместе с данными сервера.</div>${db.docs.slice().reverse().map(x=>`<div class="item"><b>${esc(x.trip)}</b> • ${esc(x.type)}<br>${esc(x.name)} ${x.data?'<span class="badge">файл сохранён</span>':''}<br><span class="muted">${esc(x.note)}</span><div class="row"><button class="action small" onclick="editDoc('${x.id}')">Редактировать</button> <button class="danger action small" onclick="del('docs','${x.id}')">Удалить</button></div></div>`).join('')||'<div class="muted">Документов нет.</div>'}</div>`}
function expenseForm(e={},prefillTripId=''){let tripId=e.tripId||prefillTripId;const withdrawal=e.operationType==='withdrawal'||e.category==='Снятие наличных';return `<div class="grid">
<label>Рейс<select id="e_trip"><option value="">Без рейса</option>${db.trips.map(t=>`<option value="${esc(t.id)}" ${tripId===t.id?'selected':''}>${esc(t.no)} • ${esc(t.from)} → ${esc(t.to)}</option>`).join('')}</select></label>
<label>Дата<input id="e_date" type="datetime-local" value="${esc(e.date||now())}"></label>
<label>Операция<select id="e_operation" onchange="toggleWithdrawalFields()"><option value="expense" ${!withdrawal?'selected':''}>Расход</option><option value="withdrawal" ${withdrawal?'selected':''}>Снятие наличных</option></select></label>
<label id="e_category_wrap">Категория<input id="e_category" value="${esc(withdrawal?'Снятие наличных':e.category||'')}" placeholder="Дорога, стоянка, питание, ремонт..."></label>
<label>Сумма<input id="e_amount" type="number" step=".01" value="${esc(e.amount)}"></label>
<label>Валюта<select id="e_cur">${currencyOptions(e.currency||'KZT')}</select></label>
<label>Способ оплаты<select id="e_payment" onchange="toggleWithdrawalFields()"><option value="cash" ${e.payment!=='card'?'selected':''}>💵 Наличные</option><option value="card" ${e.payment==='card'?'selected':''}>💳 Карта</option></select></label>
<label id="e_bank_card_wrap" style="${withdrawal||e.payment==='card'?'':'display:none'}">Банковская карта<select id="e_bank_card">${bankCardOptions(e.bankCard||'')}</select></label>
</div><div class="grid" id="e_add_card_row"><label>Добавить карту (банк / название)<input id="e_new_bank_card" placeholder="Например, Kaspi Gold •••• 1234"></label><div style="align-self:end"><button type="button" class="action" onclick="addBankCard()">Добавить карту</button></div></div><label>Примечание<input id="e_note" value="${esc(e.note)}"></label>`}
function toggleWithdrawalFields(){const op=val('e_operation'),pay=val('e_payment'),cat=document.getElementById('e_category_wrap'),card=document.getElementById('e_bank_card_wrap');if(cat)cat.style.display=op==='withdrawal'?'none':'';if(card)card.style.display=(op==='withdrawal'||pay==='card')?'':'none';if(op==='withdrawal'){const c=document.getElementById('e_category');if(c)c.value='Снятие наличных';}}
function addBankCard(){const field=document.getElementById('e_new_bank_card'),name=(field?.value||'').trim();if(!name){alert('Введите название банка или карты');return}db.bankCards ||= [];if(!db.bankCards.includes(name))db.bankCards.push(name);save();render('expenses');const sel=document.getElementById('e_bank_card');if(sel)sel.value=name;}
function expenses(){let edit=db.expenses.find(x=>x.id===window.editingExpenseId);let pre=window.newExpenseTripId||'';return `<h2>Расходы денег</h2><div class="card"><h3>${edit?'Редактирование расхода':'Новый расход'}</h3>${expenseForm(edit||{},pre)}<div class="row"><button class="primary" onclick="${edit?`updateExpense('${edit.id}')`:'addExpense()'}">${edit?'Сохранить изменения':'Добавить запись'}</button>${edit?`<button class="action" onclick="cancelExpenseEdit()">Отмена</button>`:''}</div></div><div class="card"><h3>Журнал расходов и снятия наличных</h3>${db.expenses.slice().reverse().map(x=>{let tr=db.trips.find(t=>t.id===x.tripId);let wd=x.operationType==='withdrawal'||x.category==='Снятие наличных';return `<div class="item"><b>${wd?'💵 Снятие наличных':esc(x.category||'Расход')}</b> • <b>${esc(x.amount)} ${esc(x.currency)}</b> • <span class="badge">${paymentLabel(x.payment)}</span><br>${esc(x.date)} • рейс ${esc(tr?.no||x.trip||'—')}${x.bankCard?' • Карта: '+esc(x.bankCard):''}${x.note?' • '+esc(x.note):''}<br><button class="action small" onclick="editExpense('${x.id}')">Редактировать</button> <button class="danger action small" onclick="del('expenses','${x.id}')">Удалить</button></div>`}).join('')||'<div class="muted">Записей пока нет.</div>'}</div><div class="card"><h3>Сохранённые банковские карты</h3>${(db.bankCards||[]).map(c=>`<div class="item">💳 ${esc(c)} <button class="danger action small" onclick="removeBankCard('${esc(c).replaceAll("'", "\\'")}')">Удалить</button></div>`).join('')||'<div class="muted">Карты ещё не добавлены. Добавьте название карты в форме выше.</div>'}</div>`}
function removeBankCard(name){if(!confirm('Удалить карту из списка? История операций сохранится.'))return;db.bankCards=(db.bankCards||[]).filter(c=>c!==name);save();render('expenses')}

function addTrip(){db.trips.push({id:id(),no:val('t_no'),date:val('t_date'),from:val('t_from'),to:val('t_to'),weight:val('t_weight'),status:val('t_status'),startKm:val('t_start'),endKm:val('t_end'),driver:val('t_driver'),truck:val('t_truck'),trailer:val('t_trailer')});save();render('trips')}
function updateTrip(i){let t=db.trips.find(x=>x.id===i);if(!t)return;Object.assign(t,{no:val('t_no'),date:val('t_date'),from:val('t_from'),to:val('t_to'),weight:val('t_weight'),status:val('t_status'),startKm:val('t_start'),endKm:val('t_end'),driver:val('t_driver'),truck:val('t_truck'),trailer:val('t_trailer')});window.editingTripId=null;save();render('trips')}
function editTrip(i){window.editingTripId=i;render('trips');scrollTo(0,0)}
function cancelEdit(){window.editingTripId=null;render('trips')}
function addDriver(){db.drivers.push({id:id(),name:val('d_name'),phone:val('d_phone')});save();render('fleet')}
function editDriver(i){let x=db.drivers.find(a=>a.id===i);if(!x)return;let n=prompt('ФИО',x.name);if(n===null)return;let p=prompt('Телефон',x.phone||'');if(p===null)return;x.name=n.trim();x.phone=p.trim();save();render('fleet')}
function addTruck(){db.trucks.push({id:id(),plate:val('tr_plate'),model:val('tr_model')});save();render('fleet')}
function editTruck(i){let x=db.trucks.find(a=>a.id===i);if(!x)return;let p=prompt('Госномер',x.plate);if(p===null)return;let m=prompt('Марка/модель',x.model||'');if(m===null)return;x.plate=p.trim();x.model=m.trim();save();render('fleet')}
function addTrailer(){db.trailers.push({id:id(),plate:val('tl_plate'),type:val('tl_type')});save();render('fleet')}
function editTrailer(i){let x=db.trailers.find(a=>a.id===i);if(!x)return;let p=prompt('Госномер',x.plate);if(p===null)return;let t=prompt('Тип',x.type||'');if(t===null)return;x.plate=p.trim();x.type=t.trim();save();render('fleet')}
function addFuel(){autoFuelTrip();let tripId=val('f_trip')||fuelTripForDate(val('f_date'))?.id||'',tr=db.trips.find(t=>t.id===tripId);db.fuel.push({id:id(),type:val('f_type'),date:val('f_date'),liters:val('f_liters'),cost:val('f_cost'),currency:val('f_cur'),station:val('f_station'),payment:val('f_payment')||'cash',bankCard:val('f_payment')==='card'?val('f_bank_card'):'',fuelCard:val('f_payment')==='fuelcard'?val('f_fuel_card'):'',tripId:tripId,trip:tr?.no||''});save();render('fuel')}
function updateFuel(i){let x=db.fuel.find(a=>a.id===i);if(!x)return;autoFuelTrip();let tripId=val('f_trip')||fuelTripForDate(val('f_date'))?.id||'',tr=db.trips.find(t=>t.id===tripId);Object.assign(x,{type:val('f_type'),date:val('f_date'),liters:val('f_liters'),cost:val('f_cost'),currency:val('f_cur'),station:val('f_station'),payment:val('f_payment')||'cash',bankCard:val('f_payment')==='card'?val('f_bank_card'):'',fuelCard:val('f_payment')==='fuelcard'?val('f_fuel_card'):'',tripId:tripId,trip:tr?.no||''});window.editingFuelId=null;save();render('fuel')}
function editFuel(i){window.editingFuelId=i;render('fuel');scrollTo(0,0)}
function cancelFuelEdit(){window.editingFuelId=null;render('fuel')}
function newExpenseFor(tripId){window.editingExpenseId=null;window.newExpenseTripId=tripId;render('expenses');scrollTo(0,0)}
function expensePayload(){const operationType=val('e_operation')||'expense',payment=val('e_payment');return {tripId:val('e_trip'),date:val('e_date'),operationType,category:operationType==='withdrawal'?'Снятие наличных':val('e_category'),amount:val('e_amount'),currency:val('e_cur'),payment,bankCard:(operationType==='withdrawal'||payment==='card')?val('e_bank_card'):'' ,note:val('e_note')}}
function addExpense(){let data=expensePayload();if(data.operationType==='withdrawal'&&!data.bankCard){alert('Для снятия наличных выберите банковскую карту');return}let tr=db.trips.find(t=>t.id===data.tripId);db.expenses.push({id:id(),...data,trip:tr?.no||''});window.newExpenseTripId=null;save();render('expenses')}
function updateExpense(i){let x=db.expenses.find(a=>a.id===i);if(!x)return;let data=expensePayload();if(data.operationType==='withdrawal'&&!data.bankCard){alert('Для снятия наличных выберите банковскую карту');return}let tr=db.trips.find(t=>t.id===data.tripId);Object.assign(x,data,{trip:tr?.no||''});window.editingExpenseId=null;save();render('expenses')}
function editExpense(i){window.editingExpenseId=i;window.newExpenseTripId=null;render('expenses');scrollTo(0,0)}
function cancelExpenseEdit(){window.editingExpenseId=null;window.newExpenseTripId=null;render('expenses')}
function addRoute(){db.route.push({id:id(),city:val('r_city'),type:val('r_type'),note:val('r_note'),date:val('r_date')});save();render('more')}
function editRoute(i){let x=db.route.find(a=>a.id===i);if(!x)return;let city=prompt('Город / пункт',x.city);if(city===null)return;let type=prompt('Тип',x.type);if(type===null)return;let note=prompt('Примечание',x.note||'');if(note===null)return;x.city=city.trim();x.type=type.trim();x.note=note.trim();save();render('more')}
function saveSettings(){db.company.name=val('c_name');db.company.server=val('server');db.company.apiKey=val('apiKey');db.user.name=val('u_name');db.user.role=val('u_role');save();render('more')}
function del(type,x){db[type]=db[type].filter(a=>a.id!==x);save();render(type==='trips'?'trips':type==='fuel'?'fuel':type==='expenses'?'expenses':type==='docs'?'more':type==='route'?'more':'fleet')}

function docFor(tripId){
 let trip=db.trips.find(x=>x.id===tripId); if(!trip)return;
 window.docDraft={tripId,trip:trip.no};
 showDocumentPicker();
}
function showDocumentPicker(){
 const old=document.getElementById('docPickerModal'); if(old)old.remove();
 const d=document.createElement('div');d.id='docPickerModal';d.className='modal';
 d.innerHTML=`<div class="modalbox"><h3>Добавить документ</h3><p class="muted">Сначала выберите, откуда взять документ</p>
 <div class="pickerGrid">
 <button class="picker" onclick="document.getElementById('docGallery').click()">🖼️<b>Галерея</b><span>Выбрать фото</span></button>
 <button class="picker" onclick="document.getElementById('docCamera').click()">📷<b>Камера</b><span>Сделать фото</span></button>
 <button class="picker" onclick="document.getElementById('docFile').click()">📎<b>Файл</b><span>PDF или другой файл</span></button>
 </div><button class="action" onclick="closeDocPicker()">Отмена</button>
 <input id="docGallery" type="file" accept="image/*" style="display:none" onchange="handleDocFile(this.files[0])">
 <input id="docCamera" type="file" accept="image/*" capture="environment" style="display:none" onchange="handleDocFile(this.files[0])">
 <input id="docFile" type="file" accept="application/pdf,image/*,.doc,.docx,.xls,.xlsx" style="display:none" onchange="handleDocFile(this.files[0])"></div>`;
 document.body.appendChild(d);
}
function closeDocPicker(){document.getElementById('docPickerModal')?.remove();window.docDraft=null}
function handleDocFile(file){
 if(!file||!window.docDraft)return;
 fileToDataURL(file,data=>{
   const type=prompt('Тип документа: CMR / Инвойс / Таможня / Другое','CMR')||'Другое';
   const name=prompt('Название документа',file.name||('Документ_'+window.docDraft.trip))||file.name||'Документ';
   const note=prompt('Примечание','')||'';
   db.docs.push({id:id(),trip:window.docDraft.trip,type:type.trim(),name:name.trim(),note:note.trim(),data:data,mime:file.type||''});
   save();closeDocPicker();render('more');
 });
}
function editDoc(i){
 let x=db.docs.find(a=>a.id===i);if(!x)return;
 let type=prompt('Тип документа',x.type||'');if(type===null)return;
 let note=prompt('Примечание',x.note||'');if(note===null)return;
 x.type=type.trim();x.note=note.trim();save();render('more');
}
function gps(){if(!navigator.geolocation){alert('GPS недоступен в этом браузере');return}navigator.geolocation.getCurrentPosition(p=>{let x={date:now(),lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy};db.gps.push(x);save();document.getElementById('gpsout').textContent=`${x.lat}, ${x.lon} • точность ${Math.round(x.accuracy)} м`},e=>alert('Не удалось получить GPS: '+e.message),{enableHighAccuracy:true,timeout:10000})}
function addMaintenance(){db.maintenance.push({id:id(),date:val('m_date'),km:val('m_km'),truck:val('m_truck'),trailer:val('m_trailer'),type:val('m_type'),note:val('m_note'),cost:val('m_cost'),currency:val('m_currency')||'KZT'});save();render('more')}
function exportExcel(){if(!window.XLSX){alert('Для Excel нужен интернет.');return}const wb=XLSX.utils.book_new();const columns={
'Рейсы':[['no','Номер рейса'],['date','Дата'],['from','Откуда'],['to','Куда'],['weight','Вес, т'],['status','Статус'],['startKm','Начальный пробег, км'],['endKm','Конечный пробег, км'],['driver','Водитель'],['truck','Тягач'],['trailer','Прицеп']],
'Архив рейсов':[['no','Номер рейса'],['date','Дата'],['from','Откуда'],['to','Куда'],['weight','Вес, т'],['status','Статус'],['startKm','Начальный пробег, км'],['endKm','Конечный пробег, км'],['driver','Водитель'],['truck','Тягач'],['trailer','Прицеп'],['completedAt','Дата и время завершения'],['closedBy','Кем закрыт'],['report','Итоговый отчёт']],
'Водители':[['name','ФИО водителя'],['phone','Телефон']], 'Тягачи':[['plate','Государственный номер'],['model','Модель']], 'Прицепы':[['plate','Государственный номер'],['type','Тип']],
'Топливо':[['type','Вид топлива'],['date','Дата'],['liters','Количество, л'],['cost','Стоимость'],['currency','Валюта'],['station','Заправочная станция'],['payment','Способ оплаты'],['bankCard','Банковская карта'],['fuelCard','Топливная карта'],['trip','Номер рейса']],
'Расходы':[['operationType','Тип операции'],['category','Категория'],['date','Дата'],['amount','Сумма'],['currency','Валюта'],['payment','Способ оплаты'],['bankCard','Банковская карта'],['trip','Номер рейса'],['note','Примечание']],
'Банковские карты':[['name','Название карты']], 'Техническое обслуживание':[['date','Дата'],['km','Пробег, км'],['truck','Тягач'],['trailer','Прицеп'],['type','Вид работ'],['note','Описание работ'],['cost','Стоимость'],['currency','Валюта']],
'Маршрут':[['city','Населённый пункт'],['type','Тип точки'],['note','Примечание'],['date','Дата']], 'Документы':[['trip','Номер рейса'],['type','Тип документа'],['name','Название файла'],['note','Примечание'],['mime','Формат файла']], 'GPS':[['date','Дата и время'],['lat','Широта'],['lon','Долгота'],['accuracy','Точность, м']]};
const sheets={'Рейсы':db.trips,'Архив рейсов':db.archiveTrips||[],'Водители':db.drivers,'Тягачи':db.trucks,'Прицепы':db.trailers,'Топливо':db.fuel,'Расходы':db.expenses,'Банковские карты':(db.bankCards||[]).map(name=>({name})),'Техническое обслуживание':db.maintenance,'Маршрут':db.route,'Документы':db.docs,'GPS':db.gps};
for(const [title,rows] of Object.entries(sheets)){const cols=columns[title];const data=[cols.map(c=>c[1]),...rows.map(row=>cols.map(([key])=>{let v=row[key]??'';if(key==='payment')v=title==='Топливо'?({cash:'Наличные',card:'Банковская карта',fuelcard:'Топливная карта'}[v]||v):paymentLabel(v);if(key==='operationType')v=v==='withdrawal'?'Снятие наличных':'Расход';if(key==='type'&&title==='Топливо')v=({diesel:'Дизель',adblue:'AdBlue',antigel:'Антигель'}[v]||v);return v}))];const ws=XLSX.utils.aoa_to_sheet(data);XLSX.utils.book_append_sheet(wb,ws,title);ws['!cols']=cols.map((c,i)=>({wch:Math.min(Math.max(String(c[1]).length+4,16),32)}));ws['!autofilter']={ref:ws['!ref']};ws['!freeze']={xSplit:0,ySplit:1};}XLSX.writeFile(wb,'TruckControl_Отчёт.xlsx')}
function csv(){let rows=[['Рейс','Дата','Откуда','Куда','Вес т','Статус','Начальный км','Конечный км','Километраж отчёта','Водитель','Тягач','Прицеп']].concat(db.trips.map(x=>[x.no,x.date,x.from,x.to,x.weight,x.status,x.startKm,x.endKm,Math.max(0,Number(x.endKm||0)-Number(x.startKm||0)),x.driver,x.truck,x.trailer]));let s=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(';')).join('\\n');download('TruckControl_Trips.csv','text/csv;charset=utf-8',s)}
function backup(){download('TruckControl_Backup.json','application/json',JSON.stringify(db,null,2))}
function restore(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);db.trips ||= [];db.fuel ||= [];db.expenses ||= [];db.bankCards ||= [];db.docs ||= [];db.route ||= [];db.drivers ||= [];db.trucks ||= [];db.trailers ||= [];db.gps ||= []; db.maintenance ||= [];save();render('more')}catch(e){alert('Неверный JSON')}};r.readAsText(f)}
function download(name,type,data){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>render(b.dataset.tab));
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render('home');
if(db.company.server) loadServer().catch(()=>{});
</script>
