<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>TruckControl Enterprise</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
*{box-sizing:border-box}body{margin:0;padding-bottom:80px}header{position:sticky;top:0;z-index:4;background:#111827;color:white;padding:16px}.brand{font-size:21px;font-weight:800}.sub{font-size:12px;opacity:.75}
main{padding:12px;max-width:900px;margin:auto}.tabs{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;z-index:5}.tabs button{flex:1;border:0;background:white;padding:12px 4px;font-size:11px}.tabs button.active{font-weight:800;background:#e5e7eb}
.card{background:white;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 5px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
h2,h3{margin:4px 0 10px}.metric{font-size:24px;font-weight:800}.muted{color:#6b7280;font-size:12px}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:white;margin:4px 0 8px}textarea{min-height:70px}
button.primary,button.action{border:0;border-radius:10px;padding:10px 12px;background:#111827;color:white}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.danger{background:#b91c1c!important}.ok{background:#166534!important}.small{font-size:12px}
.item{border-top:1px solid #eee;padding:10px 0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e5e7eb;font-size:11px}.hidden{display:none}
.notice{padding:10px;border-radius:10px;background:#fffbeb;border:1px solid #fde68a;font-size:12px}
</style>
</head>
<body>
<header><div class="brand">🚚 TruckControl Enterprise</div><div class="sub" id="companyLabel">Локальный режим • офлайн</div></header>
<main id="app"></main>
<nav class="tabs">
<button data-tab="home">Главная</button><button data-tab="trips">Рейсы</button><button data-tab="fleet">Автопарк</button><button data-tab="fuel">Топливо</button><button data-tab="more">Ещё</button>
</nav>
<script>
const KEY='truckcontrol_enterprise_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
company:{name:'Моя транспортная компания',server:''},
user:{name:'Пользователь',role:'dispatcher'},
trips:[],drivers:[],trucks:[],trailers:[],fuel:[],route:[],docs:[],gps:[]
};
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const val=n=>document.getElementById(n)?.value?.trim()||'';
const now=()=>new Date().toISOString().slice(0,16);
const kmTotal=()=>db.trips.reduce((a,x)=>a+(Number(x.endKm||0)-Number(x.startKm||0)>0?Number(x.endKm)-Number(x.startKm):0),0);
const liters=()=>db.fuel.reduce((a,x)=>a+Number(x.liters||0),0);

function render(tab='home'){
 document.getElementById('companyLabel').textContent=`${db.company.name} • ${db.user.name} • ${db.user.role}`;
 let a=document.getElementById('app');
 if(tab==='home') a.innerHTML=home();
 if(tab==='trips') a.innerHTML=trips();
 if(tab==='fleet') a.innerHTML=fleet();
 if(tab==='fuel') a.innerHTML=fuel();
 if(tab==='more') a.innerHTML=more();
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
}
function home(){return `<h2>Панель управления</h2>
<div class="grid3"><div class="card"><div class="muted">Рейсы</div><div class="metric">${db.trips.length}</div></div><div class="card"><div class="muted">Километры</div><div class="metric">${kmTotal()}</div></div><div class="card"><div class="muted">Топливо, л</div><div class="metric">${liters().toFixed(1)}</div></div></div>
<div class="card"><h3>Последние рейсы</h3>${db.trips.slice(-5).reverse().map(t=>`<div class="item"><b>${esc(t.no)}</b> <span class="badge">${esc(t.status)}</span><br>${esc(t.from)} → ${esc(t.to)}<br><span class="muted">Груз: ${esc(t.weight)} т • ${esc(t.driver||'водитель не назначен')}</span></div>`).join('')||'<div class="muted">Рейсов пока нет.</div>'}</div>
<div class="card"><div class="notice">Работа без интернета включена. Данные сохраняются на этом iPhone. Для общей базы компании требуется сервер.</div></div>`}

function trips(){return `<h2>Рейсы</h2>
<div class="card"><h3>Новый рейс</h3><div class="grid">
<label>Номер<input id="t_no" placeholder="TR-2026-001"></label><label>Дата<input id="t_date" type="date"></label>
<label>Откуда<input id="t_from"></label><label>Куда<input id="t_to"></label>
<label>Вес груза, т<input id="t_weight" type="number" step=".01"></label><label>Статус<select id="t_status"><option>Планируется</option><option>В пути</option><option>На таможне</option><option>Разгружен</option><option>Завершён</option></select></label>
<label>Начальный одометр, км<input id="t_start" type="number"></label><label>Конечный одометр, км<input id="t_end" type="number"></label>
<label>Водитель<select id="t_driver"><option value="">Не назначен</option>${db.drivers.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></label>
<label>Тягач<select id="t_truck"><option value="">Не назначен</option>${db.trucks.map(x=>`<option>${esc(x.plate)}</option>`).join('')}</select></label>
<label>Прицеп<select id="t_trailer"><option value="">Не назначен</option>${db.trailers.map(x=>`<option>${esc(x.plate)}</option>`).join('')}</select></label>
</div><button class="primary" onclick="addTrip()">Сохранить рейс</button></div>
<div class="card"><h3>Список</h3>${db.trips.slice().reverse().map(t=>`<div class="item"><b>${esc(t.no)}</b> <span class="badge">${esc(t.status)}</span><br>${esc(t.from)} → ${esc(t.to)} • ${esc(t.weight)} т<br>Одометр: ${esc(t.startKm)} → ${esc(t.endKm)} км<br>Водитель: ${esc(t.driver||'—')} • Тягач: ${esc(t.truck||'—')}<br><button class="action small" onclick="docFor('${t.id}')">Документы</button> <button class="danger action small" onclick="del('trips','${t.id}')">Удалить</button></div>`).join('')||'<div class="muted">Нет данных.</div>'}</div>`}

function fleet(){return `<h2>Автопарк и сотрудники</h2>
<div class="card"><h3>Водитель</h3><input id="d_name" placeholder="ФИО"><input id="d_phone" placeholder="Телефон"><button class="primary" onclick="addDriver()">Добавить</button></div>
<div class="card"><h3>Тягач</h3><input id="tr_plate" placeholder="Госномер"><input id="tr_model" placeholder="Марка/модель"><button class="primary" onclick="addTruck()">Добавить</button></div>
<div class="card"><h3>Прицеп</h3><input id="tl_plate" placeholder="Госномер"><input id="tl_type" placeholder="Тип"><button class="primary" onclick="addTrailer()">Добавить</button></div>
<div class="card"><h3>Данные</h3><b>Водители</b>${db.drivers.map(x=>`<div class="item">${esc(x.name)} • ${esc(x.phone)} <button class="danger small action" onclick="del('drivers','${x.id}')">×</button></div>`).join('')||'<div class="muted">Нет</div>'}
<b>Тягачи</b>${db.trucks.map(x=>`<div class="item">${esc(x.plate)} • ${esc(x.model)} <button class="danger small action" onclick="del('trucks','${x.id}')">×</button></div>`).join('')||'<div class="muted">Нет</div>'}
<b>Прицепы</b>${db.trailers.map(x=>`<div class="item">${esc(x.plate)} • ${esc(x.type)} <button class="danger small action" onclick="del('trailers','${x.id}')">×</button></div>`).join('')||'<div class="muted">Нет</div>'}</div>`}

function fuel(){return `<h2>Заправки</h2><div class="card"><div class="grid">
<label>Дата<input id="f_date" type="datetime-local" value="${now()}"></label><label>Литры<input id="f_liters" type="number" step=".01"></label>
<label>Стоимость<input id="f_cost" type="number" step=".01"></label><label>Валюта<select id="f_cur"><option>KZT</option><option>USD</option><option>EUR</option><option>RUB</option><option>CNY</option></select></label>
<label>АЗС<input id="f_station"></label><label>Рейс<input id="f_trip" placeholder="Номер рейса"></label></div><button class="primary" onclick="addFuel()">Добавить заправку</button></div>
<div class="card"><h3>Журнал</h3>${db.fuel.slice().reverse().map(x=>`<div class="item">${esc(x.date)} • <b>${esc(x.liters)} л</b> • ${esc(x.cost)} ${esc(x.currency)}<br>${esc(x.station)} • рейс ${esc(x.trip||'—')}</div>`).join('')||'<div class="muted">Нет заправок.</div>'}</div>`}

function more(){return `<h2>Маршрут, GPS, документы и отчёты</h2>
<div class="card"><h3>GPS</h3><button class="primary" onclick="gps()">Получить текущую точку</button><div id="gpsout" class="muted">${db.gps.slice(-1)[0]?JSON.stringify(db.gps.slice(-1)[0]):''}</div></div>
<div class="card"><h3>Точка маршрута / таможня</h3><div class="grid"><input id="r_city" placeholder="Город / пункт"><select id="r_type"><option>Маршрут</option><option>Загрузка</option><option>Выгрузка</option><option>Таможня</option><option>Стоянка</option></select><input id="r_note" placeholder="Примечание"><input id="r_date" type="datetime-local" value="${now()}"></div><button class="primary" onclick="addRoute()">Добавить</button>
${db.route.slice().reverse().map(x=>`<div class="item"><b>${esc(x.city)}</b> • <span class="badge">${esc(x.type)}</span><br>${esc(x.date)} • ${esc(x.note)}</div>`).join('')}</div>
<div class="card"><h3>Настройки компании</h3><input id="c_name" value="${esc(db.company.name)}"><input id="u_name" value="${esc(db.user.name)}"><select id="u_role"><option ${db.user.role==='dispatcher'?'selected':''}>dispatcher</option><option ${db.user.role==='manager'?'selected':''}>manager</option><option ${db.user.role==='driver'?'selected':''}>driver</option></select><input id="server" value="${esc(db.company.server)}" placeholder="URL API сервера"><button class="primary" onclick="saveSettings()">Сохранить</button></div>
<div class="card"><h3>Отчёты и резервная копия</h3><div class="row"><button class="action" onclick="csv()">CSV для Excel</button><button class="action" onclick="window.print()">Печать / PDF</button><button class="action" onclick="backup()">Backup JSON</button><label class="action">Restore<input type="file" accept=".json" style="display:none" onchange="restore(this)"></label></div></div>
<div class="card"><h3>Документы рейсов</h3>${db.docs.slice().reverse().map(x=>`<div class="item"><b>${esc(x.trip)}</b> • ${esc(x.type)}<br>${esc(x.name)}<br><span class="muted">${esc(x.note)}</span></div>`).join('')||'<div class="muted">Документов нет.</div>'}</div>`}

function addTrip(){db.trips.push({id:id(),no:val('t_no'),date:val('t_date'),from:val('t_from'),to:val('t_to'),weight:val('t_weight'),status:val('t_status'),startKm:val('t_start'),endKm:val('t_end'),driver:val('t_driver'),truck:val('t_truck'),trailer:val('t_trailer')});save();render('trips')}
function addDriver(){db.drivers.push({id:id(),name:val('d_name'),phone:val('d_phone')});save();render('fleet')}
function addTruck(){db.trucks.push({id:id(),plate:val('tr_plate'),model:val('tr_model')});save();render('fleet')}
function addTrailer(){db.trailers.push({id:id(),plate:val('tl_plate'),type:val('tl_type')});save();render('fleet')}
function addFuel(){db.fuel.push({id:id(),date:val('f_date'),liters:val('f_liters'),cost:val('f_cost'),currency:val('f_cur'),station:val('f_station'),trip:val('f_trip')});save();render('fuel')}
function addRoute(){db.route.push({id:id(),city:val('r_city'),type:val('r_type'),note:val('r_note'),date:val('r_date')});save();render('more')}
function saveSettings(){db.company.name=val('c_name');db.company.server=val('server');db.user.name=val('u_name');db.user.role=val('u_role');save();render('more')}
function del(type,x){db[type]=db[type].filter(a=>a.id!==x);save();render(type==='trips'?'trips':type==='fuel'?'fuel':'fleet')}
function docFor(tripId){let trip=db.trips.find(x=>x.id===tripId);let type=prompt('Тип документа: CMR / Инвойс / Таможня / Другое','CMR');if(!type)return;let name=prompt('Название или имя файла','CMR_'+trip.no+'.pdf')||'';let note=prompt('Примечание','')||'';db.docs.push({id:id(),trip:trip.no,type,name,note});save();render('more')}
function gps(){if(!navigator.geolocation){alert('GPS недоступен в этом браузере');return}navigator.geolocation.getCurrentPosition(p=>{let x={date:now(),lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy};db.gps.push(x);save();document.getElementById('gpsout').textContent=`${x.lat}, ${x.lon} • точность ${Math.round(x.accuracy)} м`},e=>alert('Не удалось получить GPS: '+e.message),{enableHighAccuracy:true,timeout:10000})}
function csv(){let rows=[['Рейс','Дата','Откуда','Куда','Вес т','Статус','Начальный км','Конечный км','Водитель','Тягач','Прицеп']].concat(db.trips.map(x=>[x.no,x.date,x.from,x.to,x.weight,x.status,x.startKm,x.endKm,x.driver,x.truck,x.trailer]));let s=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(';')).join('\\n');download('TruckControl_Trips.csv','text/csv;charset=utf-8',s)}
function backup(){download('TruckControl_Backup.json','application/json',JSON.stringify(db,null,2))}
function restore(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render('more')}catch(e){alert('Неверный JSON')}};r.readAsText(f)}
function download(name,type,data){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>render(b.dataset.tab));
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render('home');
</script>
</body></html>
